<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../assets/img/logo.png" type="image/png">
  <title>SmartCondo — Gestão de Porteiros</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/api.js"></script>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
<body class="dashboard-body layout-desktop">
  <header class="app-bar">
    <div class="app-bar-inner wide">
      <a href="dashboard.html" class="app-bar-brand" aria-label="SmartCondo — ir para o painel">
        <img src="../../assets/img/logo.png" alt="" class="logo-sm">
        <span class="brand-name">Smart<strong>Condo</strong></span>
      </a>
      <div class="app-bar-right">
        <a href="perfil.html" class="profile-link"><span class="profile-avatar"><img src="../../assets/img/icons/star.svg" alt="" style="width:16px;height:16px;display:block;width:16px;height:16px"></span><span class="profile-name" id="hdrName">Roberto Nascimento</span><span class="profile-role">Síndico</span></a>
        <a href="../../index.html" class="logout-btn"><img src="../../assets/img/icons/right-from-bracket.svg" width="16" height="16" alt=""> Sair</a>
      </div>
    </div>
  </header>
  <main class="dash-wrapper wide">
    <a href="dashboard.html" class="dash-back"><img src="../../assets/img/icons/arrow-left.svg" width="16" height="16" alt=""> Painel do Síndico</a>
    <div class="dash-greeting">
      <p class="greeting-sub">Painel Administrativo</p>
      <h1 class="greeting-name"><img src="../../assets/img/icons/shield-halved.svg" width="16" height="16" alt=""> Gestão de Porteiros</h1>
      <p class="greeting-condo" id="resumoEquipe">Carregando…</p>
    </div>
    <div class="stats-row">
      <div class="stat-card teal"><span class="stat-value" id="totPorteiros">—</span><span class="stat-label"><img src="../../assets/img/icons/porteiros.svg" width="16" height="16" alt="">Funcionários</span></div>
      <div class="stat-card blue"><span class="stat-value" id="totAtivos">—</span><span class="stat-label"><img src="../../assets/img/icons/circle-check.svg" width="16" height="16" alt="">Ativos</span></div>
      <div class="stat-card amber"><span class="stat-value" id="totPendentesP">—</span><span class="stat-label"><img src="../../assets/img/icons/clock.svg" width="16" height="16" alt="">Aguard. aprov.</span></div>
    </div>

    <div id="blocoPendentes">
      <h2 class="section-title"><img src="../../assets/img/icons/clock.svg" width="16" height="16" alt=""> Cadastros Aguardando Aprovação</h2>
      <div class="list-items" id="listaPendentes"></div>
      <p class="estado-lista" id="estadoPendentes">Carregando…</p>
    </div>

    <h2 class="section-title"><img src="../../assets/img/icons/shield-halved.svg" width="16" height="16" alt=""> Equipe de Portaria</h2>
    <div class="list-items" id="listaPorteiros"></div>
    <p class="estado-lista" id="estadoPorteiros">Carregando…</p>
    <p class="contato-status" id="contatoStatus" role="status"></p>

    <a href="cadastrar_porteiro.html" class="action-btn" style="margin-bottom:12px;">Cadastrar Novo Porteiro</a>
  </main>

<script src="../../assets/js/validation.js"></script>
<script src="../../assets/js/admin-ui.js"></script>
<script>
/* Gestão de porteiros: a equipe vem da API e cada porteiro tem o painel
   de permissões da seção 12 da documentação ("o síndico escolhe quais
   ações estarão disponíveis para o porteiro"). */
(function() {
  'use strict';
  var api = window.SmartCondo.api, ui = window.SmartCondo.ui;
  if (!api.protegerPagina('sindico')) return;

  function campo(id) { return document.getElementById(id); }
  var acoes = [];

  var CORES = ['', 'amber', 'blue', 'purple'];
  function iniciais(nome) {
    var p = (nome || '').trim().split(/\s+/);
    return (((p[0] || '')[0] || '') + ((p[p.length - 1] || '')[0] || '')).toUpperCase();
  }
  function cor(nome) {
    var soma = 0;
    for (var i = 0; i < (nome || '').length; i++) soma += nome.charCodeAt(i);
    return CORES[soma % CORES.length];
  }

  function avatarDe(p) {
    var el = document.createElement('div');
    el.className = ('list-avatar ' + cor(p.nome)).trim();
    el.textContent = iniciais(p.nome);
    return el;
  }

  function infoDe(p, texto) {
    var info = document.createElement('div');
    info.className = 'list-info';
    var h = document.createElement('h3');
    h.textContent = p.nome;
    var sub = document.createElement('p');
    sub.textContent = texto;
    info.appendChild(h);
    info.appendChild(sub);
    return info;
  }

  function cartaoPendente(p) {
    var item = document.createElement('div');
    item.className = 'list-item';
    item.appendChild(avatarDe(p));
    item.appendChild(infoDe(p, p.email + ' · ' + ui.formatarTelefone(p.telefone)));

    var acoesEl = document.createElement('div');
    acoesEl.className = 'acoes-aprovacao';
    var sim = document.createElement('button');
    sim.type = 'button'; sim.className = 'pill-acao aprovar'; sim.textContent = 'Aprovar';
    var nao = document.createElement('button');
    nao.type = 'button'; nao.className = 'pill-acao recusar'; nao.textContent = 'Recusar';
    acoesEl.appendChild(sim); acoesEl.appendChild(nao);

    function decidir(aprovado) {
      sim.disabled = nao.disabled = true;
      api.post('/usuarios/' + p.id + '/aprovacao', { aprovado: aprovado })
        .then(carregar)
        .catch(function(e) { sim.disabled = nao.disabled = false; alert(e.message); });
    }
    sim.addEventListener('click', function() { decidir(true); });
    nao.addEventListener('click', function() {
      if (confirm('Recusar o cadastro de ' + p.nome + '?')) decidir(false);
    });

    item.appendChild(acoesEl);
    return item;
  }

  /* Painel de permissões: abre sob o porteiro, carrega o que está
     valendo hoje e grava a escolha do síndico. */
  function painelPermissoes(p) {
    var painel = document.createElement('div');
    painel.className = 'painel-permissoes';
    painel.hidden = true;

    var titulo = document.createElement('p');
    titulo.className = 'permissoes-titulo';
    titulo.textContent = 'O que ' + p.nome.split(' ')[0] + ' pode fazer no sistema';
    painel.appendChild(titulo);

    var grade = document.createElement('div');
    grade.className = 'permissoes-grade';
    var caixas = {};
    acoes.forEach(function(acao) {
      var rotulo = document.createElement('label');
      rotulo.className = 'permissao-item';
      var caixa = document.createElement('input');
      caixa.type = 'checkbox';
      caixas[acao.chave] = caixa;
      var texto = document.createElement('span');
      texto.textContent = acao.rotulo;
      rotulo.appendChild(caixa);
      rotulo.appendChild(texto);
      grade.appendChild(rotulo);
    });
    painel.appendChild(grade);

    var rodape = document.createElement('div');
    rodape.className = 'permissoes-rodape';
    var salvar = document.createElement('button');
    salvar.type = 'button';
    salvar.className = 'action-btn';
    salvar.style.cssText = 'width:auto;margin:0;padding:9px 18px;font-size:13px;';
    salvar.textContent = 'Salvar permissões';
    var aviso = document.createElement('span');
    aviso.className = 'permissoes-aviso';
    aviso.setAttribute('role', 'status');
    rodape.appendChild(salvar);
    rodape.appendChild(aviso);
    painel.appendChild(rodape);

    var carregado = false;
    function carregarPermissoes() {
      if (carregado) return;
      aviso.textContent = 'Carregando…';
      api.get('/usuarios/porteiros/' + p.id + '/permissoes')
        .then(function(dados) {
          acoes.forEach(function(a) { caixas[a.chave].checked = !!dados[a.chave]; });
          aviso.textContent = '';
          carregado = true;
        })
        .catch(function(e) {
          // 404 = ainda sem permissões definidas; começa tudo desmarcado.
          if (e.status === 404) { aviso.textContent = 'Nenhuma permissão definida ainda.'; carregado = true; }
          else aviso.textContent = e.message;
        });
    }

    salvar.addEventListener('click', function() {
      var corpo = {};
      acoes.forEach(function(a) { corpo[a.chave] = caixas[a.chave].checked; });
      salvar.disabled = true;
      aviso.textContent = 'Salvando…';
      api.put('/usuarios/porteiros/' + p.id + '/permissoes', corpo)
        .then(function() { aviso.textContent = 'Permissões salvas.'; })
        .catch(function(e) { aviso.textContent = e.message; })
        .then(function() { salvar.disabled = false; });
    });

    return { elemento: painel, carregar: carregarPermissoes };
  }

  function cartaoPorteiro(p) {
    var bloco = document.createElement('div');
    bloco.className = 'porteiro-bloco';

    var item = document.createElement('div');
    item.className = 'list-item';
    item.appendChild(avatarDe(p));
    item.appendChild(infoDe(p, p.email + ' · ' + ui.formatarTelefone(p.telefone)));

    var contato = document.createElement('div');
    contato.className = 'contato-acoes';
    // Chat abre a conversa no painel de mensagens; Ligar disca o
    // telefone cadastrado (no celular, abre a ligação direto).
    var chatBtn = document.createElement('button');
    chatBtn.type = 'button';
    chatBtn.className = 'contato-btn';
    chatBtn.title = 'Abrir chat com ' + p.nome;
    chatBtn.setAttribute('aria-label', chatBtn.title);
    var imgChat = document.createElement('img');
    imgChat.src = '../../assets/img/icons/comunicados.svg';
    imgChat.alt = '';
    chatBtn.appendChild(imgChat);
    chatBtn.appendChild(document.createTextNode('Chat'));
    chatBtn.addEventListener('click', function() {
      if (window.SmartCondo.chat) window.SmartCondo.chat.abrir(p.id);
    });
    contato.appendChild(chatBtn);

    var ligar = document.createElement('a');
    ligar.className = 'contato-btn';
    ligar.href = 'tel:' + String(p.telefone || '').replace(/[^\d+]/g, '');
    ligar.title = 'Ligar para ' + p.nome;
    ligar.setAttribute('aria-label', ligar.title);
    var imgLigar = document.createElement('img');
    imgLigar.src = '../../assets/img/icons/phone.svg';
    imgLigar.alt = '';
    ligar.appendChild(imgLigar);
    ligar.appendChild(document.createTextNode('Ligar'));
    contato.appendChild(ligar);
    item.appendChild(contato);

    var selo = document.createElement('span');
    selo.className = 'badge ' + (ui.CLASSE_STATUS[p.status] || 'badge-neutral');
    selo.textContent = ui.ROTULO_STATUS[p.status] || p.status;
    item.appendChild(selo);

    var permissoes = painelPermissoes(p);

    var alternar = document.createElement('button');
    alternar.type = 'button';
    alternar.className = 'contato-btn';
    alternar.textContent = 'Permissões';
    alternar.setAttribute('aria-expanded', 'false');
    alternar.addEventListener('click', function() {
      var abrindo = permissoes.elemento.hidden;
      permissoes.elemento.hidden = !abrindo;
      alternar.setAttribute('aria-expanded', String(abrindo));
      if (abrindo) permissoes.carregar();
    });
    contato.appendChild(alternar);

    // Porteiro que saiu da equipe perde o acesso à portaria na hora.
    if (p.status === 'ativo') {
      var inativar = document.createElement('button');
      inativar.type = 'button';
      inativar.className = 'contato-btn perigo';
      inativar.textContent = 'Inativar';
      inativar.setAttribute('aria-label', 'Inativar ' + p.nome);
      inativar.addEventListener('click', function() {
        ui.inativarUsuario(p, inativar, carregar);
      });
      contato.appendChild(inativar);
    }

    bloco.appendChild(item);
    bloco.appendChild(permissoes.elemento);
    return bloco;
  }

  function carregar() {
    campo('estadoPorteiros').textContent = 'Carregando…';
    return api.get('/usuarios?papel=porteiro')
      .then(function(lista) {
        var pendentes = lista.filter(function(p) { return p.status === 'aguardando_aprovacao'; });
        var equipe = lista.filter(function(p) { return p.status !== 'aguardando_aprovacao'; });

        campo('totPorteiros').textContent = lista.length;
        campo('totAtivos').textContent =
          lista.filter(function(p) { return p.status === 'ativo'; }).length;
        campo('totPendentesP').textContent = pendentes.length;

        // Sem ninguem na fila, a secao inteira sai da tela.
        campo('blocoPendentes').hidden = !pendentes.length;
        var caixaPend = campo('listaPendentes');
        caixaPend.innerHTML = '';
        campo('estadoPendentes').textContent = '';
        pendentes.forEach(function(p) { caixaPend.appendChild(cartaoPendente(p)); });

        var caixa = campo('listaPorteiros');
        caixa.innerHTML = '';
        campo('estadoPorteiros').textContent =
          equipe.length ? '' : 'Nenhum porteiro cadastrado ainda.';
        equipe.forEach(function(p) { caixa.appendChild(cartaoPorteiro(p)); });
      })
      .catch(function(e) {
        campo('estadoPorteiros').textContent = e.message;
        campo('estadoPendentes').textContent = '';
      });
  }

  var usuario = api.sessao.usuario();
  if (usuario) campo('hdrName').textContent = usuario.nome;

  api.get('/condominios/meu')
    .then(function(c) { campo('resumoEquipe').textContent = 'Equipe de portaria · ' + c.nome; })
    .catch(function() { campo('resumoEquipe').textContent = 'Equipe de portaria'; });

  api.get('/usuarios/porteiros/acoes')
    .then(function(lista) { acoes = lista; })
    .catch(function() { acoes = []; })
    .then(carregar);
})();
</script>
<script src="../../assets/js/sessao.js"></script>
<script src="../../assets/js/acessibilidade.js"></script>
</body>
</html>
