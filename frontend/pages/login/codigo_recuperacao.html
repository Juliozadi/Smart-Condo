<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../assets/img/logo.png" type="image/png">
  <title>SmartCondo — Código de Verificação</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
<body>
  <main class="container">
    <header class="logo-area">
      <img src="../../assets/img/logo.png" alt="Logo SmartCondo" class="logo">
      <div class="logo-text">
        <h1>Smart Condo</h1>
        <p>Gestão de Condomínios</p>
      </div>
    </header>
    <h2>Verifique seu acesso</h2>
    <p class="subtitle">Digite o código de 6 dígitos enviado para o seu e-mail.</p>

    <form id="formCodigo" novalidate>
      <div class="input-box">
        <img src="../../assets/img/icons/lock.svg" width="16" height="16" alt="">
        <input type="text" id="codigoInput" inputmode="numeric" placeholder="000000" required maxlength="6" autocomplete="one-time-code"
          style="text-align:center;letter-spacing:4px;font-size:20px;font-weight:700;" aria-label="Código de verificação">
      </div>

      <p style="font-size:12px;color:var(--muted);margin-bottom:20px;text-align:center;font-weight:500;">
        Não recebeu? &nbsp;<a href="#" id="reenviarCodigo" style="color:var(--primary-texto);font-weight:700;text-decoration:none;">Reenviar código</a>
      </p>

      <button class="login-btn" type="submit">
        Verificar e continuar
      </button>
    </form>

    <a href="esqueci_senha.html" class="back-link">
      <img src="../../assets/img/icons/arrow-left.svg" width="16" height="16" alt=""> Voltar
    </a>
  </main>


  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelector('form').addEventListener('submit', function(e) {
        var input = this.querySelector('input');
        var val = input.value.replace(/\D/g, '');
        document.querySelectorAll('.erro-validacao').forEach(function(el) { el.remove(); });
        if (val.length < 4) {
          mostrarErro(input, 'Informe o código de 4 dígitos');
          e.preventDefault();
        }
      });
    });
  </script>
  <script src="../../assets/js/validation.js"></script>
  <script>
/* Etapa do código — doc, seção 9 ("Esqueci minha senha").
   A API valida o código no mesmo passo em que redefine a senha, então
   aqui o código só é levado adiante; quem confere é a tela seguinte. */
(function() {
  var email = null;
  try { email = sessionStorage.getItem('smartcondo_email_recuperacao'); } catch (_) {}

  // Chegou direto nesta URL, sem passar pela etapa anterior.
  if (!email) {
    window.location.replace('esqueci_senha.html');
    return;
  }

  var campo = document.getElementById('codigoInput');
  campo.addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 6);
  });

  document.getElementById('formCodigo').addEventListener('submit', function(e) {
    e.preventDefault();
    document.querySelectorAll('.erro-validacao').forEach(function(el) { el.remove(); });

    var codigo = campo.value.trim();
    if (codigo.length !== 6) {
      mostrarErro(campo, 'O código tem 6 dígitos');
      return;
    }
    try { sessionStorage.setItem('smartcondo_codigo_recuperacao', codigo); } catch (_) {}
    window.location.href = 'nova_senha.html';
  });

  document.getElementById('reenviarCodigo').addEventListener('click', function(e) {
    e.preventDefault();
    var link = this;
    link.textContent = 'Enviando...';
    SmartCondo.api
      .post('/auth/senha/recuperar', { email: email, canal: 'email' }, { semToken: true })
      .then(function() { link.textContent = 'Código reenviado'; })
      .catch(function() { link.textContent = 'Reenviar código'; });
  });
})();
</script>
<script src="../../assets/js/acessibilidade.js"></script>

</body>
</html>
