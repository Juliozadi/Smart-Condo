<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../assets/img/logo.png" type="image/png">
  <title>SmartCondo — Mudanças Agendadas</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/api.js"></script>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
<body class="dashboard-body layout-desktop">

  <header class="app-bar">
    <div class="app-bar-inner">
      <a href="dashboard.html" class="app-bar-brand" aria-label="SmartCondo — ir para o painel">
        <img src="../../assets/img/logo.png" alt="" class="logo-sm">
        <span class="brand-name">Smart<strong>Condo</strong></span>
      </a>
      <div class="app-bar-right">
        <a href="perfil.html" class="profile-link"><span class="profile-avatar"><img src="../../assets/img/icons/shield-halved.svg" alt="" style="width:16px;height:16px;display:block;width:16px;height:16px"></span><span class="profile-name" id="hdrName">Carlos Pereira</span><span class="profile-role">Porteiro</span></a>
        <a href="../../index.html" class="logout-btn"><img src="../../assets/img/icons/right-from-bracket.svg" width="16" height="16" alt=""> Sair</a>
      </div>
    </div>
  </header>

  <main class="dash-wrapper">

    <a href="dashboard.html" class="dash-back">
      <img src="../../assets/img/icons/arrow-left.svg" width="16" height="16" alt=""> Painel do Porteiro
    </a>

    <div class="dash-greeting">
      <p class="greeting-sub">Portaria</p>
      <h1 class="greeting-name"><img src="../../assets/img/icons/box-open.svg" width="26" height="26" alt=""> Mudanças Agendadas</h1>
      <p class="greeting-condo">Só entram as aprovadas pelo síndico, no dia e no horário marcados</p>
    </div>

    <h2 class="section-title"><img src="../../assets/img/icons/calendar-check.svg" width="16" height="16" alt=""> Hoje</h2>
    <div class="reserve-list" id="listaHoje" aria-live="polite"></div>
    <p class="estado-lista" id="estadoHoje">Carregando…</p>

    <h2 class="section-title"><img src="../../assets/img/icons/clock.svg" width="16" height="16" alt=""> Próximos Dias</h2>
    <div class="reserve-list" id="listaProximas"></div>
    <p class="estado-lista" id="estadoProximas"></p>

  </main>

<script src="../../assets/js/mudancas.js"></script>
<script>
/* Mudanças para a portaria: só as aprovadas, de hoje em diante. Caminhão
   fora desta lista ou fora do horário não entra sem falar com o síndico. */
(function() {
  'use strict';
  var api = window.SmartCondo.api, mudancas = window.SmartCondo.mudancas;
  var usuario = api.protegerPagina('porteiro');
  if (!usuario) return;

  function campo(id) { return document.getElementById(id); }
  var hoje = mudancas.somarDias(0);

  api.get('/mudancas').then(function(lista) {
    var deHoje = lista.filter(function(m) { return m.data === hoje; });
    var proximas = lista.filter(function(m) { return m.data !== hoje; });
    [[deHoje, 'listaHoje', 'estadoHoje', 'Nenhuma mudança hoje.'],
     [proximas, 'listaProximas', 'estadoProximas', 'Nenhuma mudança marcada para os próximos dias.']
    ].forEach(function(grupo) {
      var caixa = campo(grupo[1]);
      grupo[0].forEach(function(m) { caixa.appendChild(mudancas.cartao(m, true)); });
      campo(grupo[2]).textContent = grupo[0].length ? '' : grupo[3];
    });
  }).catch(function(e) { campo('estadoHoje').textContent = e.message; });

  campo('hdrName').textContent = usuario.nome;
})();
</script>
<script src="../../assets/js/sessao.js"></script>
<script src="../../assets/js/acessibilidade.js"></script>
</body>
</html>
