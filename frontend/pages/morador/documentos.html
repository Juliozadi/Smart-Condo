<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../assets/img/logo.png" type="image/png">
  <title>SmartCondo — Documentos</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/api.js"></script>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
<body class="dashboard-body layout-mobile">

  <header class="app-bar">
    <div class="app-bar-inner">
      <a href="dashboard.html" class="app-bar-brand" aria-label="SmartCondo — ir para o painel">
        <img src="../../assets/img/logo.png" alt="SmartCondo" class="logo-sm">
        <span class="brand-name">Smart<strong>Condo</strong></span>
      </a>
      <div class="app-bar-right">
        <a href="perfil.html" class="profile-link"><span class="profile-avatar"><img src="../../assets/img/icons/user.svg" alt="" style="width:16px;height:16px;display:block;width:16px;height:16px"></span><span class="profile-name" id="hdrName">João Silva</span><span class="profile-role">Morador</span></a>
        <a href="../../index.html" class="logout-btn"><img src="../../assets/img/icons/right-from-bracket.svg" width="16" height="16" alt=""> Sair</a>
      </div>
    </div>
  </header>

  <main class="dash-wrapper">

    <a href="dashboard.html" class="dash-back">
      <img src="../../assets/img/icons/arrow-left.svg" width="16" height="16" alt=""> Painel do Morador
    </a>

    <div class="dash-greeting">
      <p class="greeting-sub">Apto 204 — João Silva</p>
      <h2 class="greeting-name"><img src="../../assets/img/icons/folder-open.svg" width="16" height="16" alt="">Documentos</h2>
      <p class="greeting-condo"><img src="../../assets/img/icons/folder-open.svg" width="16" height="16" alt=""> Acesse e baixe os documentos do condomínio</p>
    </div>

    <div class="barra-acoes">
      <div class="campo-busca">
        <img src="../../assets/img/icons/folder-open.svg" alt="">
        <input type="search" id="buscaDocumento" placeholder="Buscar por título ou descrição" aria-label="Buscar documento">
      </div>
      <select id="filtroCategoria" aria-label="Filtrar por categoria">
        <option value="">Todas as categorias</option>
        <option value="convencao">Convenção</option>
        <option value="regimento">Regimento interno</option>
        <option value="ata">Atas de assembleia</option>
        <option value="planta">Plantas</option>
        <option value="prestacao_contas">Prestação de contas</option>
        <option value="outro">Outros</option>
      </select>
    </div>

    <div class="dash-grid" id="listaDocumentos"></div>
    <p class="estado-lista" id="estadoLista">Carregando…</p>

    <div class="info-card">
      
      <p>Para solicitar documentos não listados ou uma via do seu contrato, entre em contato com a administração: <strong><a href="mailto:smartcondo@gmail.com">smartcondo@gmail.com</a></strong></p>
    </div>

  </main>

  
<script src="../../assets/js/validation.js"></script>
<script>
/* Documentos do condomínio (documentação, seção 13.6). O servidor já
   entrega só o que é público mais o que é da unidade do morador. */
(function() {
  'use strict';
  var api = window.SmartCondo.api;
  var usuario = api.protegerPagina('morador');
  if (!usuario) return;

  function campo(id) { return document.getElementById(id); }
  var documentos = [];

  var ROTULO_CATEGORIA = {
    convencao: 'Convenção', regimento: 'Regimento interno', ata: 'Ata de assembleia',
    planta: 'Planta', prestacao_contas: 'Prestação de contas', outro: 'Outro'
  };
  var VISUAL_CATEGORIA = {
    convencao: ['icon-purple', 'file-contract.svg'],
    regimento: ['icon-blue', 'file-contract.svg'],
    ata: ['icon-teal', 'scroll.svg'],
    planta: ['icon-yellow', 'building.svg'],
    prestacao_contas: ['icon-teal', 'file-invoice-dollar.svg'],
    outro: ['icon-blue', 'folder-open.svg']
  };

  function tamanho(kb) {
    if (!kb) return null;
    return kb >= 1024 ? (kb / 1024).toFixed(1).replace('.', ',') + ' MB' : kb + ' KB';
  }
  function dataCurta(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return meses[d.getMonth()] + '/' + d.getFullYear();
  }

  function cartao(doc) {
    var card = document.createElement('div');
    card.className = 'dash-card';

    var visual = VISUAL_CATEGORIA[doc.categoria] || VISUAL_CATEGORIA.outro;
    var icone = document.createElement('div');
    icone.className = 'card-icon ' + visual[0];
    var glifo = document.createElement('span');
    glifo.className = 'glifo';
    glifo.style.setProperty('--icone', 'url(../../assets/img/icons/' + visual[1] + ')');
    icone.appendChild(glifo);

    var info = document.createElement('div');
    info.className = 'card-info';
    var h = document.createElement('h4');
    h.textContent = doc.titulo;
    var p = document.createElement('p');
    var partes = [ROTULO_CATEGORIA[doc.categoria] || doc.categoria];
    if (doc.unidade) partes.push('Unidade ' + doc.unidade);
    partes.push(dataCurta(doc.publicado_em));
    var medida = tamanho(doc.tamanho_kb);
    if (medida) partes.push(medida);
    p.textContent = partes.join(' · ');
    info.appendChild(h);
    info.appendChild(p);
    if (doc.descricao) {
      var descricao = document.createElement('p');
      descricao.textContent = doc.descricao;
      info.appendChild(descricao);
    }

    // O arquivo só sai da API com o token: não dá para ser um link comum.
    var baixar = document.createElement('button');
    baixar.type = 'button';
    baixar.className = 'link-baixar';
    if (doc.url) {
      baixar.textContent = 'Abrir';
      baixar.setAttribute('aria-label', 'Abrir ' + doc.titulo);
      baixar.addEventListener('click', function() {
        api.abrirArquivo(doc.url, doc.titulo).catch(function(e) { alert(e.message); });
      });
    } else {
      baixar.textContent = 'Indisponível';
      baixar.disabled = true;
      baixar.title = 'O síndico ainda não enviou o arquivo deste documento.';
    }

    card.appendChild(icone);
    card.appendChild(info);
    card.appendChild(baixar);
    return card;
  }

  /* Quem digita "convencao" espera achar "Convenção": a busca compara
     sem acento dos dois lados. */
  function semAcento(texto) {
    return (texto || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function desenhar() {
    var busca = semAcento(campo('buscaDocumento').value.trim());
    var categoria = campo('filtroCategoria').value;
    var lista = documentos.filter(function(d) {
      if (categoria && d.categoria !== categoria) return false;
      if (!busca) return true;
      return semAcento(d.titulo + ' ' + (d.descricao || '')).indexOf(busca) >= 0;
    });

    var caixa = campo('listaDocumentos');
    caixa.innerHTML = '';
    campo('estadoLista').textContent = lista.length ? '' :
      (documentos.length ? 'Nenhum documento encontrado com esses filtros.'
                         : 'Nenhum documento publicado ainda.');
    lista.forEach(function(d) { caixa.appendChild(cartao(d)); });
  }

  function carregar() {
    campo('estadoLista').textContent = 'Carregando…';
    return api.get('/documentos')
      .then(function(lista) {
        // Convenção e regimento primeiro, depois o mais recente.
        var ordem = ['convencao', 'regimento', 'ata', 'prestacao_contas', 'planta', 'outro'];
        documentos = lista.slice().sort(function(a, b) {
          var pa = ordem.indexOf(a.categoria), pb = ordem.indexOf(b.categoria);
          if (pa !== pb) return pa - pb;
          return new Date(b.publicado_em) - new Date(a.publicado_em);
        });
        desenhar();
      })
      .catch(function(e) { campo('estadoLista').textContent = e.message; });
  }

  campo('buscaDocumento').addEventListener('input', (function() {
    var timer = null;
    return function() { clearTimeout(timer); timer = setTimeout(desenhar, 250); };
  })());
  campo('filtroCategoria').addEventListener('change', desenhar);

  var unidade = usuario.unidade
    ? (usuario.unidade.bloco && usuario.unidade.bloco !== 'unico'
        ? usuario.unidade.bloco + ' ' : '') + usuario.unidade.numero
    : null;
  var saudacao = document.querySelector('.greeting-sub');
  if (saudacao) saudacao.textContent = (unidade ? 'Apto ' + unidade + ' — ' : '') + usuario.nome;
  var nomeTopo = document.getElementById('hdrName');
  if (nomeTopo) nomeTopo.textContent = usuario.nome;

  carregar();
})();
</script>
<script src="../../assets/js/sessao.js"></script>
<script src="../../assets/js/acessibilidade.js"></script>
</body>
</html>
