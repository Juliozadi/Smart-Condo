<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../assets/img/logo.png" type="image/png">
  <title>SmartCondo — Ocorrências</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/api.js"></script>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
<body class="dashboard-body layout-mobile">

  <header class="app-bar">
    <div class="app-bar-inner">
      <a href="../../index.html" class="app-bar-brand">
        <img src="../../assets/img/logo.png" alt="SmartCondo" class="logo-sm">
        <span class="brand-name">Smart<strong>Condo</strong></span>
      </a>
      <div class="app-bar-right">
        <a href="perfil.html" class="profile-link"><span class="profile-avatar"><img src="../../assets/img/icons/user.svg" alt="" style="width:16px;height:16px;display:block;width:16px;height:16px"></span><span class="profile-name" id="hdrName">João Silva</span><span class="profile-role">Morador</span></a>
        <a href="../../index.html" class="logout-btn"><img src="../../assets/img/icons/right-from-bracket.svg" width="16" height="16" alt=""> Sair</a>
      </div>
    </div>
  </header>

  <main class="dash-wrapper">

    <a href="dashboard.html" class="dash-back">
      <img src="../../assets/img/icons/arrow-left.svg" width="16" height="16" alt=""> Painel do Morador
    </a>

    <div class="dash-greeting">
      <p class="greeting-sub">Apto 204 — João Silva</p>
      <h2 class="greeting-name"><img src="../../assets/img/icons/circle-exclamation.svg" width="26" height="26" alt=""> Ocorrências</h2>
      <p class="greeting-condo">Registre e acompanhe incidentes no condomínio</p>
    </div>

    <div class="stats-row">
      <div class="stat-card teal"><span class="stat-value" id="totAbertas">—</span><span class="stat-label"><img src="../../assets/img/icons/circle-exclamation.svg" width="16" height="16" alt="">Abertas</span></div>
      <div class="stat-card blue"><span class="stat-value" id="totAnalise">—</span><span class="stat-label"><img src="../../assets/img/icons/clock.svg" width="16" height="16" alt="">Em análise</span></div>
      <div class="stat-card amber"><span class="stat-value" id="totResolvidas">—</span><span class="stat-label"><img src="../../assets/img/icons/circle-check.svg" width="16" height="16" alt="">Resolvidas</span></div>
    </div>

    <!-- Nova ocorrência -->
    <p class="section-title"><img src="../../assets/img/icons/circle-exclamation.svg" width="16" height="16" alt=""> Registrar Nova Ocorrência</p>
    <div class="form-card">
      <h3><img src="../../assets/img/icons/circle-exclamation.svg" width="16" height="16" alt=""> Descrição da Ocorrência</h3>
      <form id="formOcorrencia" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="ocorre_tipoDeOcorrencia">Tipo de ocorrência</label>
            <select id="ocorre_tipoDeOcorrencia" required>
              <option value="" disabled selected>Selecione</option>
              <option value="convivencia">Barulho excessivo</option>
              <option value="manutencao">Vazamento / infiltração</option>
              <option value="manutencao">Iluminação com defeito</option>
              <option value="manutencao">Elevador com problema</option>
              <option value="patrimonio">Dano em área comum</option>
              <option value="seguranca">Problema de segurança</option>
              <option value="convivencia">Animais soltos</option>
              <option value="convivencia">Descumprimento de regras</option>
              <option value="geral">Outro</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ocorre_prioridade">Prioridade</label>
            <select id="ocorre_prioridade" required>
              <option value="" disabled selected>Selecione</option>
              <option value="urgente">Urgente — risco imediato</option>
              <option value="alta">Alta — afeta minha unidade</option>
              <option value="normal" selected>Normal — área comum</option>
              <option value="baixa">Baixa — sugestão de melhoria</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="ocorre_localDaOcorrencia">Local da ocorrência</label>
          <select id="ocorre_localDaOcorrencia" required>
            <option value="" disabled selected>Selecione</option>
            <option value="__unidade">Minha unidade</option>
            <option>Corredor</option>
            <option>Área de lazer</option>
            <option>Estacionamento</option>
            <option>Portaria</option>
            <option>Elevador</option>
            <option value="__outro">Outro local</option>
          </select>
        </div>
        <div class="form-group" id="grupoOutroLocal" hidden>
          <label for="ocorre_outroLocal">Descreva o local</label>
          <input id="ocorre_outroLocal" type="text" maxlength="120" placeholder="Ex: escada do bloco B, entre o 3º e o 4º andar">
        </div>
        <div class="form-group">
          <label for="ocorre_assunto">Assunto</label>
          <input id="ocorre_assunto" type="text" required minlength="3" maxlength="180" placeholder="Resuma em uma linha o que aconteceu">
        </div>
        <div class="form-group">
          <label for="ocorre_descricaoDetalhada">Descrição detalhada</label>
          <textarea id="ocorre_descricaoDetalhada" required placeholder="Descreva a ocorrência com o máximo de detalhes possível..." style="min-height:100px;width:100%;padding:12px;border-radius:var(--radius-xs);border:1.5px solid var(--border);font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;background:var(--surface-2);resize:vertical;outline:none;" onFocus="this.style.borderColor='var(--primary)'" onBlur="this.style.borderColor='var(--border)'"></textarea>
        </div>
        <p class="form-erro" id="erroOcorrencia" role="alert"></p>
        <button class="action-btn" type="submit" style="margin-top:4px;">
          Registrar Ocorrência
        </button>
      </form>
    </div>

    <!-- Ocorrências abertas -->
    <p class="section-title"><img src="../../assets/img/icons/circle-exclamation.svg" width="16" height="16" alt=""> Minhas Ocorrências</p>
    <div class="list-items" id="listaOcorrencias"></div>
    <p class="estado-lista" id="estadoOcorrencias">Carregando…</p>

  </main>


<script src="../../assets/js/validation.js"></script>
<script>
/* Ocorrências do morador (documentação, seção 8): abre o chamado pela API
   e acompanha a resposta do síndico. Só as próprias ocorrências aparecem —
   quem filtra é o servidor. */
(function() {
  'use strict';
  var api = window.SmartCondo.api;
  var usuario = api.protegerPagina('morador');
  if (!usuario) return;

  function campo(id) { return document.getElementById(id); }

  var ROTULO_STATUS = {
    aberta: 'Aberta', em_analise: 'Em análise',
    resolvida: 'Resolvida', arquivada: 'Arquivada'
  };
  var CLASSE_STATUS = {
    aberta: 'badge-alert', em_analise: 'badge-blue',
    resolvida: 'badge-ok', arquivada: 'badge-neutral'
  };
  var ICONE_PRIORIDADE = {
    urgente: ['icon-red', 'triangle-exclamation.svg'],
    alta:    ['icon-yellow', 'circle-exclamation.svg'],
    normal:  ['icon-teal', 'circle-exclamation.svg'],
    baixa:   ['icon-blue', 'circle-exclamation.svg']
  };
  var ROTULO_PRIORIDADE = {
    urgente: 'Urgente', alta: 'Alta', normal: 'Normal', baixa: 'Baixa'
  };

  function dataCurta(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2);
  }

  function unidadeDoUsuario() {
    if (!usuario.unidade) return null;
    var bloco = usuario.unidade.bloco && usuario.unidade.bloco !== 'unico'
      ? usuario.unidade.bloco + ' ' : '';
    return bloco + usuario.unidade.numero;
  }

  function cartao(o) {
    var item = document.createElement('div');
    item.className = 'list-item';

    var visual = ICONE_PRIORIDADE[o.prioridade] || ICONE_PRIORIDADE.normal;
    var icone = document.createElement('div');
    icone.className = 'card-icon ' + visual[0] + ' icone-ocorrencia';
    // Os SVGs têm fill fixo; como glifo mascarado eles assumem a cor da
    // prioridade em vez de saírem sempre vermelhos.
    var glifo = document.createElement('span');
    glifo.className = 'glifo';
    glifo.style.setProperty('--icone', 'url(../../assets/img/icons/' + visual[1] + ')');
    icone.appendChild(glifo);

    var info = document.createElement('div');
    info.className = 'list-info';
    var titulo = document.createElement('h5');
    titulo.textContent = o.titulo;
    var sub = document.createElement('p');
    var partes = ['Registrada em ' + dataCurta(o.criado_em)];
    if (o.local) partes.push(o.local);
    partes.push('Prioridade ' + (ROTULO_PRIORIDADE[o.prioridade] || o.prioridade).toLowerCase());
    sub.textContent = partes.join(' · ');
    info.appendChild(titulo);
    info.appendChild(sub);
    if (o.resposta) {
      var resposta = document.createElement('p');
      resposta.className = 'ocorrencia-resposta';
      resposta.textContent = 'Síndico: ' + o.resposta;
      info.appendChild(resposta);
    }

    var selo = document.createElement('span');
    selo.className = 'badge ' + (CLASSE_STATUS[o.status] || 'badge-neutral');
    selo.textContent = ROTULO_STATUS[o.status] || o.status;

    item.appendChild(icone);
    item.appendChild(info);
    item.appendChild(selo);
    return item;
  }

  function carregar() {
    campo('estadoOcorrencias').textContent = 'Carregando…';
    return api.get('/portaria/ocorrencias')
      .then(function(lista) {
        campo('totAbertas').textContent =
          lista.filter(function(o) { return o.status === 'aberta'; }).length;
        campo('totAnalise').textContent =
          lista.filter(function(o) { return o.status === 'em_analise'; }).length;
        campo('totResolvidas').textContent =
          lista.filter(function(o) { return o.status === 'resolvida'; }).length;

        var caixa = campo('listaOcorrencias');
        caixa.innerHTML = '';
        campo('estadoOcorrencias').textContent =
          lista.length ? '' : 'Você ainda não registrou nenhuma ocorrência.';
        lista.forEach(function(o) { caixa.appendChild(cartao(o)); });
      })
      .catch(function(e) { campo('estadoOcorrencias').textContent = e.message; });
  }

  // "Outro local" abre o campo livre; "minha unidade" usa a do cadastro.
  campo('ocorre_localDaOcorrencia').addEventListener('change', function() {
    campo('grupoOutroLocal').hidden = this.value !== '__outro';
  });

  function localEscolhido() {
    var select = campo('ocorre_localDaOcorrencia');
    if (select.value === '__outro') return campo('ocorre_outroLocal').value.trim();
    if (select.value === '__unidade') return unidadeDoUsuario() || 'Minha unidade';
    return select.value;
  }

  campo('formOcorrencia').addEventListener('submit', function(evento) {
    evento.preventDefault();
    var erro = campo('erroOcorrencia');
    erro.className = 'form-erro';
    erro.textContent = '';

    var select = campo('ocorre_tipoDeOcorrencia');
    var tipo = select.options[select.selectedIndex];
    var assunto = campo('ocorre_assunto').value.trim();
    var descricao = campo('ocorre_descricaoDetalhada').value.trim();
    var local = localEscolhido();

    if (!select.value || !campo('ocorre_localDaOcorrencia').value) {
      erro.textContent = 'Escolha o tipo e o local da ocorrência.';
      return;
    }
    if (assunto.length < 3) {
      erro.textContent = 'Escreva um assunto com pelo menos 3 caracteres.';
      return;
    }
    if (descricao.length < 5) {
      erro.textContent = 'Descreva a ocorrência com um pouco mais de detalhe.';
      return;
    }
    if (campo('ocorre_localDaOcorrencia').value === '__outro' && !local) {
      erro.textContent = 'Descreva o local da ocorrência.';
      return;
    }

    var corpo = {
      titulo: assunto,
      descricao: descricao,
      categoria: select.value,
      local: local || null,
      prioridade: campo('ocorre_prioridade').value || 'normal'
    };

    var botao = this.querySelector('button[type=submit]');
    var texto = botao.textContent;
    botao.disabled = true;
    botao.textContent = 'Enviando…';

    api.post('/portaria/ocorrencias', corpo)
      .then(function() {
        campo('formOcorrencia').reset();
        campo('grupoOutroLocal').hidden = true;
        erro.className = 'form-erro sucesso';
        erro.textContent = 'Ocorrência registrada. O síndico foi notificado.';
        return carregar();
      })
      .catch(function(e) { erro.textContent = e.message; })
      .then(function() { botao.disabled = false; botao.textContent = texto; });
  });

  var unidade = unidadeDoUsuario();
  var cabecalho = document.querySelector('.greeting-sub');
  if (cabecalho) cabecalho.textContent = (unidade ? unidade + ' — ' : '') + usuario.nome;
  var nome = document.getElementById('hdrName');
  if (nome) nome.textContent = usuario.nome;

  carregar();
})();
</script>
<script src="../../assets/js/sessao.js"></script>
<script src="../../assets/js/acessibilidade.js"></script>
</body>
</html>
