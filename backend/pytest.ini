[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    # Resposta que não bate com o esquema é erro, não aviso: um caso
    # assim passou despercebido atrás do "ignore" acima.
    error:Pydantic serializer warnings:UserWarning
