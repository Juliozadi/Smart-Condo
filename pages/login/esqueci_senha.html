<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../assets/img/logo.png" type="image/png">
  <title>SmartCondo — Recuperar Senha</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
<body>
  <main class="container">
    <header class="logo-area">
      <img src="../../assets/img/logo.png" alt="Logo SmartCondo" class="logo">
      <div class="logo-text">
        <h1>Smart Condo</h1>
        <p>Gestão de Condomínios</p>
      </div>
    </header>
    <section class="recover-area">
      <h2>Esqueci minha senha</h2>
      <p class="subtitle">Informe seu e-mail ou telefone e enviaremos um código de recuperação.</p>

      <div class="recover-info">
        <img src="../../assets/img/icons/circle-check.svg" width="16" height="16" alt="">
        <span>Você receberá um código de verificação no contato informado.</span>
      </div>

      <form class="login-form" id="formRecuperar" novalidate>
        <div class="input-box">
          <img src="../../assets/img/icons/envelope.svg" width="16" height="16" alt="">
          <input type="email" id="emailRecuperar" placeholder="E-mail cadastrado" required autocomplete="email">
        </div>
        <button class="login-btn" type="submit">
          Enviar código de recuperação
        </button>
      </form>

      <a href="../../index.html" class="back-link">
        <img src="../../assets/img/icons/arrow-left.svg" width="16" height="16" alt="">Voltar para o login
      </a>
    </section>
  </main>


  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelector('.login-form').addEventListener('submit', function(e) {
        var input = this.querySelector('input');
        var val = input.value.trim();
        document.querySelectorAll('.erro-validacao').forEach(function(el) { el.remove(); });
        if (!val) {
          mostrarErro(input, 'Informe seu e-mail ou telefone');
          e.preventDefault();
        }
      });
    });
  </script>
  <script src="../../assets/js/validation.js"></script>
  <script>
/* Solicita o código de recuperação — doc, seção 9 ("Esqueci minha senha").
   A API responde igual para e-mail cadastrado ou não, para não revelar
   quem tem conta; por isso a tela sempre segue para a etapa do código. */
document.getElementById('formRecuperar').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('emailRecuperar').value.trim();
  var botao = this.querySelector('button[type=submit]');
  var textoOriginal = botao.innerHTML;

  document.querySelectorAll('.erro-validacao').forEach(function(el) { el.remove(); });
  if (!email) {
    mostrarErro(document.getElementById('emailRecuperar'), 'Informe seu e-mail');
    return;
  }

  botao.disabled = true;
  botao.innerHTML = 'Enviando...';

  SmartCondo.api.post('/auth/senha/recuperar', { email: email, canal: 'email' }, { semToken: true })
    .then(function() {
      // O e-mail segue para a próxima etapa, que precisa dele na redefinição.
      try { sessionStorage.setItem('smartcondo_email_recuperacao', email); } catch (_) {}
      window.location.href = 'codigo_recuperacao.html';
    })
    .catch(function(erro) {
      botao.disabled = false;
      botao.innerHTML = textoOriginal;
      mostrarErro(document.getElementById('emailRecuperar'), erro.message);
    });
});
</script>
<script src="../../assets/js/acessibilidade.js"></script>

</body>
</html>
