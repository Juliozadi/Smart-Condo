<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../assets/img/logo.png" type="image/png">
  <title>SmartCondo — Recuperar Senha</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
<body>
  <main class="container">
    <header class="logo-area">
      <img src="../../assets/img/logo.png" alt="Logo SmartCondo" class="logo">
      <div class="logo-text">
        <h1>Smart Condo</h1>
        <p>Gestão de Condomínios</p>
      </div>
    </header>
    <section class="recover-area">
      <h2>Esqueci minha senha</h2>
      <p class="subtitle">Informe seu e-mail ou telefone e enviaremos um código de recuperação.</p>

      <div class="recover-info">
        <img src="../../assets/img/icons/circle-check.svg" width="16" height="16" alt="">
        <span>Você receberá um código de verificação no contato informado.</span>
      </div>

      <form class="login-form" action="codigo_recuperacao.html">
        <div class="input-box">
          <img src="../../assets/img/icons/envelope.svg" width="16" height="16" alt="">
          <input type="text" placeholder="E-mail ou telefone cadastrado" required autocomplete="email">
        </div>
        <button class="login-btn" type="submit">
          Enviar código de recuperação
        </button>
      </form>

      <a href="../../index.html" class="back-link">
        <img src="../../assets/img/icons/arrow-left.svg" width="16" height="16" alt="">Voltar para o login
      </a>
    </section>
  </main>


  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelector('.login-form').addEventListener('submit', function(e) {
        var input = this.querySelector('input');
        var val = input.value.trim();
        document.querySelectorAll('.erro-validacao').forEach(function(el) { el.remove(); });
        if (!val) {
          mostrarErro(input, 'Informe seu e-mail ou telefone');
          e.preventDefault();
        }
      });
    });
  </script>
  <script src="../../assets/js/validation.js"></script>
  <script src="../../assets/js/acessibilidade.js"></script>

</body>
</html>
